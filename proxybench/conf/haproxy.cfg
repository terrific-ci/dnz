global
    # Threads: one per CPU the container may use (cpuset).
    maxconn 20000
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-keep-alive 300s
    option forwardfor
    http-reuse always

frontend web
    bind :80
    bind :443 ssl crt /bench/work/tls/haproxy.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    default_backend app

backend app
    server origin 172.28.54.10:80 maxconn 1000
