# The origin every proxy forwards to: nginx serving two static files
# (1 KiB at /, 64 KiB at /64k). It runs on its own CPU.
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 8192; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=16;
    keepalive_requests 1000000;
    keepalive_timeout 300s;
    server {
        listen 80 reuseport backlog=4096;
        root /bench/work/www;
        location = / { try_files /1k.html =404; }
        location = /64k { try_files /64k.html =404; }
        default_type text/html;
    }
}
