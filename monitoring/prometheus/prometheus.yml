# Used by docker-compose.yml: the target and token are written to
# /prometheus/dnz/ from the environment before Prometheus starts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/dnz-alerts.yml

scrape_configs:
  - job_name: dnz
    scheme: __SCHEME__
    metrics_path: /metrics
    authorization:
      credentials_file: /prometheus/dnz/token
    file_sd_configs:
      - files: [/prometheus/dnz/targets.json]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
