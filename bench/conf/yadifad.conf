# YADIFA: authoritative for bench.example (copied into its data path), no
# response rate limiting (on by default).
<main>
    daemon      off
    chroot      off
    logpath     "/tmp/yadifa"
    pidfile     "/tmp/yadifa/yadifad.pid"
    datapath    "/tmp/yadifa"
    keyspath    "/tmp/yadifa/keys"
    xfrpath     "/tmp/yadifa/xfr"
    user        root
    group       root
    listen      0.0.0.0
    port        53
    allow-query any
</main>

<zone>
    domain  bench.example
    file    bench.example.zone
    type    primary
</zone>

<rrl>
    enabled false
</rrl>
