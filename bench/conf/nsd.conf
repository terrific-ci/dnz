# NSD: authoritative for bench.example, two server processes, no response
# rate limiting (200 a second per /24 by default).
server:
    ip-address: 0.0.0.0
    server-count: 2
    reuseport: yes
    username: ""
    chroot: ""
    zonesdir: "/bench/work/zones"
    zonelistfile: "/tmp/nsd/zone.list"
    xfrdfile: "/tmp/nsd/xfrd.state"
    xfrdir: "/tmp/nsd"
    pidfile: "/tmp/nsd/nsd.pid"
    verbosity: 0
    rrl-ratelimit: 0
    rrl-whitelist-ratelimit: 0

remote-control:
    control-enable: no

zone:
    name: bench.example
    zonefile: bench.example.zone
