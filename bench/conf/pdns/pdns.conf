# PowerDNS Authoritative: bench.example from the zone file (bind backend),
# two receiver threads.
launch=bind
bind-config=/bench/conf/pdns/named.conf
local-address=0.0.0.0
local-port=53
receiver-threads=2
reuseport=yes
socket-dir=/tmp/pdns
guardian=no
daemon=no
disable-syslog=yes
loglevel=3
security-poll-suffix=
webserver=no
api=no
