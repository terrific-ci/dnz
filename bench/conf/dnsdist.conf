-- dnsdist: a load balancer with a packet cache in front of knot, two
-- listening threads.
setSecurityPollSuffix("")
setLocal("0.0.0.0:53", { reusePort = true })
addLocal("0.0.0.0:53", { reusePort = true })
setACL({ "0.0.0.0/0" })
newServer({ address = "172.28.53.10", name = "knot", checkName = "fwd.example." })
getPool(""):setCache(newPacketCache(100000))
