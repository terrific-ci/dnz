# Authoritative for bench.example (auth-zone), forwarding the rest to knot,
# without DNSSEC validation, like DNZ's defaults for forwarding.
server:
    interface: 0.0.0.0
    access-control: 0.0.0.0/0 allow
    num-threads: 2
    so-reuseport: yes
    do-daemonize: no
    username: ""
    chroot: ""
    use-syslog: no
    logfile: ""
    verbosity: 0
    module-config: "iterator"
    msg-cache-size: 64m
    rrset-cache-size: 128m
    do-not-query-localhost: no

auth-zone:
    name: "bench.example"
    zonefile: "/bench/work/zones/bench.example.zone"
    for-downstream: yes
    for-upstream: no
    fallback-enabled: no

forward-zone:
    name: "."
    forward-addr: 172.28.53.10

remote-control:
    control-enable: no
