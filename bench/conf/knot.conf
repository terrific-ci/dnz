server:
    listen: 0.0.0.0@53
    rundir: /run/knot
    udp-workers: 2
    tcp-workers: 2
    background-workers: 1

log:
  - target: stderr
    any: warning

database:
    storage: /tmp/knot

template:
  - id: default
    storage: /bench/work/zones
    semantic-checks: off
    journal-content: none
    zonefile-sync: -1

zone:
  - domain: bench.example
    file: bench.example.zone
  - domain: fwd.example
    file: fwd.example.zone
