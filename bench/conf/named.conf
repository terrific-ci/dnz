// BIND 9: authoritative for bench.example, forwarding the rest to knot,
// without DNSSEC validation, like DNZ's defaults for forwarding.
options {
    directory "/tmp/named";
    pid-file none;
    session-keyfile "/tmp/named/session.key";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    allow-recursion { any; };
    dnssec-validation no;
    forwarders { 172.28.53.10; };
    forward only;
    max-cache-size 256m;
};

controls { };

logging {
    category default { default_stderr; };
    category lame-servers { null; };
};

zone "bench.example" {
    type primary;
    file "/bench/work/zones/bench.example.zone";
};
